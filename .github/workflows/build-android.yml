name: Build Android

on:
  workflow_call:
    inputs:
      sign:
        required: true
        type: boolean
        default: false
        description: Sign application
    secrets:
      KEYSTORE:
        required: true
      KEYSTORE_PASS:
        required: true

  workflow_dispatch:
    inputs:
      sign:
        required: true
        type: boolean
        default: false
        description: Sign application

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Build Package
        run: |
          chmod +x ./gradlew
          ./gradlew clean androidApp:assembleRelease
          mv androidApp/build/outputs/apk/release/*.apk unsigned-android.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-android.apk
          path: unsigned-android.apk

  sign:
    if: ${{ inputs.sign }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Unsigned Package
        uses: actions/download-artifact@v8
        with:
          name: unsigned-android.apk
      - name: Sign Package
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          sudo apt install apksigner
          echo $KEYSTORE | base64 --decode > release.keystore
          apksigner sign --ks release.keystore --ks-pass env:KEYSTORE_PASS --in unsigned-android.apk --out openbible-android.apk
          rm release.keystore
          apksigner verify --print-certs openbible-android.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openbible-android.apk
          path: openbible-android.apk
