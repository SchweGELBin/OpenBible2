name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit
    with:
      sign: true

  build-desktop:
    strategy:
      matrix:
          os: [macos-latest, ubuntu-latest, windows-latest]
    uses: ./.github/workflows/build-desktop.yml
    with:
      os: ${{ matrix.os }}

  release:
    needs: [ build-android, build-desktop ]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
          fetch-depth: 0
    - name: Generate Changelog
      uses: orhun/git-cliff-action@v4
      with:
        args: -vv --latest --strip all
    - name: Create BodyFile
      run: |
        VERSION_CODE=$(cat gradle/libs.versions.toml| grep app-versionCode | awk '{print $3}' | tr -d '"')
        echo "## General [Changelog](metadata/en-US/changelogs/$VERSION_CODE.txt)" > bodyFile
        cat "metadata/en-US/changelogs/$VERSION_CODE.txt" >> bodyFile
        (echo; echo "---"; echo) >> bodyFile
        echo "## Full [Changelog](docs/CHANGELOG.md)" >> bodyFile
        cat "git-cliff/CHANGELOG.md" >> bodyFile
    - name: Download Artifacts
      uses: actions/download-artifact@v8
    - name: Upload Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: openbible-*.*/*
        bodyFile: bodyFile
